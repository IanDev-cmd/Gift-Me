}\nfunction svURL(lat, lng) {\n  return \"https://www.google.com/maps?layer=c&cbll=\" + lat + \",\" + lng + \"&cbp=12,20,0,0,0&output=svembed\";\n}\nfunction svLink(lat, lng) {\n  return \"https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=\" + lat + \",\" + lng;\n}\nfunction pin(kind, label) {\n  return L.divIcon({ className: \"pinwrap\", html: '<div class=\"pin ' + kind + '\">' + label + \"<\/div>\", iconSize: [88, 28], iconAnchor: [44, 14] });\n}\nfunction clearMapLayers() {\n  [schoolLayer, mallLayer, lineLayer, radiusLayer].forEach((layer) => { if (layer) map.removeLayer(layer); });\n  schoolLayer = mallLayer = lineLayer = radiusLayer = null;\n}\nfunction syncRadius() {\n  const note = $(\"#radius-note\");\n  if (!map || !mapSchool) return;\n  const maxed = map.getZoom() >= map.getMaxZoom();\n  if (maxed && !radiusLayer) {\n    radiusLayer = L.circle([mapSchool.lat, mapSchool.lng], { radius: 420, color: \"#1D4ED8\", weight: 2, fillColor: \"#3B82F6\", fillOpacity: 0.18 }).addTo(map);\n    note.hidden = false;\n  } else if (!maxed && radiusLayer) {\n    map.removeLayer(radiusLayer);\n    radiusLayer = null;\n    note.hidden = true;\n  }\n}\nlet svMap, svMarker;\nfunction showStreet(which) {\n  svTarget = which;\n  if (!mapSchool) return;\n  const p = which === \"mall\" ? { lat: mapSchool.mallLat, lng: mapSchool.mallLng } : mapSchool;\n  $(\"#svframe\").src = svURL(p.lat, p.lng);\n  $(\"#svlink\").href = svLink(p.lat, p.lng);\n  if (typeof L !== \"undefined\") {\n    if (!svMap) {\n      svMap = L.map(\"svmap\", { zoomControl: false, attributionControl: false, maxZoom: 19 });\n      L.tileLayer(\"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png\", { maxZoom: 19 }).addTo(svMap);\n    }\n    if (svMarker) svMap.removeLayer(svMarker);\n    svMarker = L.circleMarker([p.lat, p.lng], { radius: 8, color: \"#1D4ED8\", fillColor: \"#1D4ED8\", fillOpacity: 0.9 }).addTo(svMap);\n    svMap.setView([p.lat, p.lng], 18);\n    setTimeout(() => svMap.invalidateSize(),
