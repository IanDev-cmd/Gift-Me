services:
  # Public URL: https://gift-me.onrender.com
  - type: web
    name: gift-me
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AT_USERNAME
        value: sandbox
      - key: MOCK_MODE
        value: "false"
      - key: AT_API_KEY
        sync: false
